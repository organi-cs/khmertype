[project]
name = "khmertyper"
version = "0.1.0"
description = "A Monkeytype-style typing test for Khmer (and English), in the terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "textual>=1.0",
    "regex>=2023.0",
]

[project.scripts]
khmertyper = "khmertyper.__main__:main"

[dependency-groups]
dev = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khmertyper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
